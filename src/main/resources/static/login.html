<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OILTRACE - Authentication</title>
    
    <!-- Firebase SDK (Compat Version) -->
    <script defer src="/__/firebase/10.7.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/10.7.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/10.7.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    
    <style>
        :root {
            --bg-color: #05080f;
            --card-bg: #0b111a;
            --input-bg: #06090e;
            --border-color: #1a2332;
            --text-main: #ffffff;
            --text-muted: #6b7a90;
            --accent-blue: #007bff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Topographic background simulation using radial gradients */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 123, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 123, 255, 0.03) 0%, transparent 50%);
        }
        
        .split-layout {
            display: flex;
            gap: 2rem;
            max-width: 1100px;
            width: 90%;
            height: 650px;
            align-items: stretch;
        }

        /* Left Side: Map Image Container */
        .map-container {
            flex: 1;
            background-image: url('images/login-bg.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Right Side: Auth Form Container */
        .auth-card {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 3rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            color: #3b82f6;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        .tagline span { color: #3b82f6; }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            width: 16px;
            height: 16px;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .btn-submit {
            background: #1877f2;
            color: #ffffff;
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: #1664c9;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin: 1.5rem 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .divider::before { margin-right: 1em; }
        .divider::after { margin-left: 1em; }

        .btn-google {
            background: transparent;
            color: var(--text-main);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.85rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .btn-google:hover {
            background: rgba(255,255,255,0.05);
        }
        
        .google-shield {
            color: #3b82f6;
            width: 16px;
            height: 16px;
        }

        .google-logo {
            position: absolute;
            right: 1.25rem;
        }

        .auth-switch {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2rem;
        }

        .auth-switch a {
            color: #3b82f6;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-switch a:hover { text-decoration: underline; }

        .hidden { display: none !important; }
        
        /* Mobile responsive */
        @media (max-width: 850px) {
            .split-layout { flex-direction: column; height: auto; }
            .map-container { display: none; } /* Hide map on small screens */
            .auth-card { padding: 2rem; }
        }
    </style>
</head>
<body>

    <div class="split-layout">
        <!-- Left Side: Map -->
        <div class="map-container"></div>

        <!-- Right Side: Auth Form -->
        <div class="auth-card">
            
            <div class="auth-header">
                <div class="logo-wrap">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="4"></circle>
                        <circle cx="12" cy="12" r="1" fill="currentColor"></circle>
                    </svg>
                    <span class="logo-text">OILTRACE</span>
                    <div class="tagline">Detect. <span>Track.</span> Attribute.</div>
                </div>
            </div>

            <!-- LOGIN VIEW -->
            <div id="view-login">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <h1 class="auth-title">Welcome back</h1>
                    <p class="auth-subtitle">Sign in to continue to your dashboard</p>
                </div>

                <form id="form-login">
                    <div class="form-group">
                        <label for="login-email">Email address or Username</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <input type="text" id="login-email" placeholder="Enter your email or username" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <input type="password" id="login-password" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">Sign In</button>
                </form>

                <div class="divider">or</div>

                <button class="btn-google btn-google-auth">
                    <svg class="google-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    Sign in with Google
                    <svg class="google-logo" width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.7 17.74 9.5 24 9.5z"></path>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                        <path fill="none" d="M0 0h48v48H0z"></path>
                    </svg>
                </button>

                <div class="auth-switch">
                    Don't have an account? <a onclick="switchTab('signup')">Sign up</a>
                </div>
            </div>

            <!-- SIGNUP VIEW -->
            <div id="view-signup" class="hidden">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <h1 class="auth-title">Create account</h1>
                    <p class="auth-subtitle">Sign up to get started</p>
                </div>

                <form id="form-signup">
                    <div class="form-group">
                        <label for="signup-username">Username</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <input type="text" id="signup-username" placeholder="Choose a username" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email address</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            <input type="email" id="signup-email" placeholder="Enter your email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <input type="password" id="signup-password" placeholder="Create a password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">Sign Up</button>
                </form>

                <div class="divider">or</div>

                <button class="btn-google btn-google-auth">
                    <svg class="google-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    Sign in with Google
                    <svg class="google-logo" width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.7 17.74 9.5 24 9.5z"></path>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                        <path fill="none" d="M0 0h48v48H0z"></path>
                    </svg>
                </button>

                <div class="auth-switch">
                    Already have an account? <a onclick="switchTab('login')">Sign In</a>
                </div>
            </div>

            <div id="auth-error" class="text-red" style="margin-top: 1.5rem; font-size: 0.85rem; text-align: center; display: none;"></div>
        </div>
    </div>

    <!-- Core Auth Logic -->
    <script src="js/auth.js"></script>
    <script>
        function switchTab(tab) {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-signup').classList.add('hidden');
            document.getElementById('auth-error').style.display = 'none';
            document.getElementById(`view-${tab}`).classList.remove('hidden');
        }
    </script>
</body>
</html>
